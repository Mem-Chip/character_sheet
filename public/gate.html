<!doctype html>
<!-- 站点门禁页（server/gate.ts）：没输过站点密码时 nginx 把页面转到这里 -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width">
<title>密码</title>
<form id="f">
  <input id="pw" type="password" autofocus required>
  <button>进入</button>
</form>
<p id="msg"></p>
<script>
  f.onsubmit = async (e) => {
    e.preventDefault();
    const r = await fetch('api/gate/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ password: pw.value }) });
    if (r.ok) return location.replace('./');
    msg.textContent = (await r.json().catch(() => ({}))).error || '不对';
  };
</script>
